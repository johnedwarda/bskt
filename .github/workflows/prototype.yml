# Builds the interactive prototype (prototype/) and publishes it to GitHub Pages.
name: Prototype

on:
  push:
    branches: [main]
    paths: ['prototype/**', 'scripts/build-prototype.mjs', '.github/workflows/prototype.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-prototype.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/site
      - id: deployment
        uses: actions/deploy-pages@v4
